# Publishes a new version to the Comfy Registry whenever pyproject.toml changes on main
# (bump [project].version to release). The Registry workflow from docs.comfy.org, with one
# addition: the publish step is skipped, with a notice, while the repository has no
# REGISTRY_ACCESS_TOKEN secret, instead of failing.
name: Publish to Comfy registry
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'logolabs' }}
    env:
      HAS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN != '' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Publish Custom Node
        if: ${{ env.HAS_TOKEN == 'true' }}
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
      - name: No registry token
        if: ${{ env.HAS_TOKEN != 'true' }}
        run: echo "::notice::REGISTRY_ACCESS_TOKEN is not set in the repository secrets; nothing was published."
