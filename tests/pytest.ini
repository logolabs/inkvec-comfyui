# Run as `python -m pytest tests` from the repository root. This file makes tests/ the
# rootdir: the repository root is a ComfyUI package (it has an __init__.py with relative
# imports), which pytest must not try to import as a plain module. conftest.py loads it
# as a package instead, the way ComfyUI does.
[pytest]
addopts = -p no:cacheprovider
